<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc"><title id="title">What attribution can and cannot verify</title><desc id="desc">A measured link path is distinct from discovery with no verified tracking; unknown demand is never assigned an invented percentage.</desc><text x="600" y="118" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="21" font-weight="780" fill="#174B3A" text-anchor="middle" letter-spacing="1.1">WHAT CAN WE ACTUALLY ATTRIBUTE?</text><path d="M1117 128 Q1122 137 1131 142 Q1122 147 1117 156 Q1112 147 1103 142 Q1112 137 1117 128Z" fill="#B99151" stroke="none" stroke-width="0" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="600" cy="723" rx="460" ry="13" fill="#202821" opacity="0.08"/><rect x="82" y="215" width="484" height="430" rx="19" fill="#202821" stroke="none" stroke-width="0" opacity="0.055"/><rect x="76" y="206" width="484" height="430" rx="19" fill="#FFFFFF" stroke="#202821" stroke-width="2.6" opacity="1"/><rect x="98" y="229" width="173" height="29" rx="14" fill="#D6E8D6" stroke="none" stroke-width="0" opacity="1"/><text x="184.5" y="249" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="760" fill="#174B3A" text-anchor="middle" letter-spacing="0">TRACKED PATH</text><rect x="116" y="325" width="148" height="109" rx="12" fill="#F8F5EE" stroke="#202821" stroke-width="2.5" opacity="1"/><text x="190" y="357" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="710" fill="#174B3A" text-anchor="middle" letter-spacing="0">Source link</text><path d="M151 389 H230" fill="none" stroke="#174B3A" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M154 405 H215" fill="none" stroke="#BBC5BE" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="283" y1="382" x2="337" y2="382" stroke="#174B3A" stroke-width="3" stroke-linecap="round"/><path d="M326.8 388.3 L337 382 L326.8 375.7" fill="none" stroke="#174B3A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="356" y="325" width="161" height="109" rx="12" fill="#EFF3EE" stroke="#202821" stroke-width="2.5" opacity="1"/><text x="437" y="357" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="750" fill="#174B3A" text-anchor="middle" letter-spacing="0">Visit</text><circle cx="437" cy="391" r="15" fill="#D6E8D6" stroke="#174B3A" stroke-width="2"/><path d="M151 480 H484" fill="none" stroke="#B99151" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="301" y="518" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="750" fill="#174B3A" text-anchor="middle" letter-spacing="0">Evidence: recorded event</text><circle cx="137" cy="484" r="13" fill="#D6E8D6" stroke="#174B3A" stroke-width="2"/><rect x="650" y="215" width="479" height="430" rx="19" fill="#202821" stroke="none" stroke-width="0" opacity="0.055"/><rect x="644" y="206" width="479" height="430" rx="19" fill="#F8F5EE" stroke="#202821" stroke-width="2.6" opacity="1"/><rect x="665" y="229" width="188" height="29" rx="14" fill="#F6E2D9" stroke="none" stroke-width="0" opacity="1"/><text x="759.0" y="249" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="760" fill="#CC6B55" text-anchor="middle" letter-spacing="0">UNATTRIBUTED</text><circle cx="744" cy="367" r="34" fill="#FFFFFF" stroke="#202821" stroke-width="3"/><path d="M721 365 Q744 338 768 365" fill="none" stroke="#B99151" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M724 379 Q746 395 765 375" fill="none" stroke="#B99151" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M794 367 H925" fill="none" stroke="#BBC5BE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 9"/><rect x="945" y="325" width="130" height="92" rx="12" fill="#FFFFFF" stroke="#202821" stroke-width="2.5" opacity="1"/><text x="1010" y="364" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="42" font-weight="780" fill="#CC6B55" text-anchor="middle" letter-spacing="0">?</text><text x="885" y="508" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="740" fill="#174B3A" text-anchor="middle" letter-spacing="0">Do not invent a share</text><text x="885" y="538" font-family="Inter,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="520" fill="#202821" text-anchor="middle" letter-spacing="0">without evidence.</text></svg>