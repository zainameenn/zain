<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="art-title art-desc"><title id="art-title">LTV to CAC Ratio Calculator</title><desc id="art-desc">Customer lifetime value built from recurring purchases compared against acquisition cost in a balance-like visual and a simple ratio line.</desc><ellipse cx="601" cy="726" rx="475" ry="15" fill="#202821" opacity="0.07"/><path d="M1110 164.1 Q1114.25 171.75 1121.9 176 Q1114.25 180.25 1110 187.9 Q1105.75 180.25 1098.1 176 Q1105.75 171.75 1110 164.1 Z" fill="#B99151" stroke="none" stroke-width="0" stroke-linejoin="round" stroke-linecap="round"/><text x="600" y="162" fill="#174B3A" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="790" text-anchor="middle">CUSTOMER VALUE  /  ACQUISITION COST</text><rect x="113" y="218" width="417" height="425" rx="20" fill="#202821" stroke="none" stroke-width="0" opacity="0.07"/><rect x="106" y="208" width="417" height="425" rx="20" fill="#FFFFFF" stroke="#202821" stroke-width="3"/><rect x="140" y="234" width="121" height="29" rx="14" fill="#D6E8D6" stroke="none" stroke-width="0"/><text x="200.5" y="254" fill="#174B3A" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="770" text-anchor="middle">LIFETIME VALUE</text><text x="141" y="310" fill="#202821" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="24" font-weight="780" text-anchor="start">Value over time</text><rect x="170" y="366" width="276" height="36" rx="7" fill="#F3E8D4" stroke="#202821" stroke-width="2"/><text x="308" y="390" fill="#174B3A" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="610" text-anchor="middle">First period</text><rect x="170" y="419" width="276" height="36" rx="7" fill="#D6E8D6" stroke="#202821" stroke-width="2"/><text x="308" y="443" fill="#174B3A" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="610" text-anc