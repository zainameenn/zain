<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-label="Fix the issues that matter first."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF7F0"/><stop offset="1" stop-color="#F0F1EB"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B5B47"/><stop offset="1" stop-color="#0E382D"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#273F35" flood-opacity=".10"/></filter><pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#C6C8B9" opacity=".5"/></pattern></defs><rect x="0" y="0" width="1600" height="960" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="960" rx="0" fill="url(#dots)" stroke="none" stroke-width="1"/><text x="75" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#A57F42" font-weight="700" text-anchor="start" letter-spacing="2.5">07 / SITE AUDIT PRIORITIES</text><text x="75" y="148" font-family="Georgia, serif" font-size="53" fill="#202A25" font-weight="400" text-anchor="start" letter-spacing="0">Fix the issues that matter first.</text><text x="75" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">An audit is a list of signals. You still need to choose what to do.</text><rect x="75" y="925" width="140" height="4" rx="2" fill="#124938" stroke="none" stroke-width="1"/><text x="1470" y="930" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5C6962" font-weight="700" text-anchor="end" letter-spacing="1.5">ZAINAMEEN  /  FREE TOOLS</text><rect x="92" y="240" width="1420" height="600" rx="24" fill="#FFFFFF" stroke="#D7D5CD" stroke-width="1" filter="url(#shadow)"/><text x="138" y="300" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#A57F42" font-weight="700" text-anchor="start" letter-spacing="1.8">EXAMPLE ISSUE TRIAGE</text><rect x="130" y="343" width="1345" height="76" rx="15" fill="#124938" stroke="none" stroke-width="1"/><text x="166" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">CHECK</text><text x="716" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">WHY IT MATTERS</text><text x="1211" y="394" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#FFFFFF" font-weight="700" text-anchor="start" letter-spacing="0">PRIORITY</text><rect x="132" y="430" width="1341" height="82" rx="12" fill="#FAF7F0" stroke="none" stroke-width="1"/><text x="165" y="473" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#202A25" font-weight="700" text-anchor="start" letter-spacing="0">Important page blocked</text><text x="716" y="473" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">Search engines may not access it</text><rect x="1223" y="441" width="160" height="42" rx="21" fill="#F4E4DF" stroke="none" stroke-width="1"/><text x="1240" y="470" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#124938" font-weight="700" text-anchor="start" letter-spacing="0">FIX FIRST</text><text x="165" y="563" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#202A25" font-weight="700" text-anchor="start" letter-spacing="0">Broken internal link</text><text x="716" y="563" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">People cannot reach the intended page</text><rect x="1223" y="531" width="160" height="42" rx="21" fill="#F1E9DB" stroke="none" stroke-width="1"/><text x="1240" y="560" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#124938" font-weight="700" text-anchor="start" letter-spacing="0">CHECK NOW</text><rect x="132" y="610" width="1341" height="82" rx="12" fill="#FAF7F0" stroke="none" stroke-width="1"/><text x="165" y="653" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#202A25" font-weight="700" text-anchor="start" letter-spacing="0">Missing meta description</text><text x="716" y="653" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">May affect search snippet clarity</text><rect x="1223" y="621" width="160" height="42" rx="21" fill="#E3EFE9" stroke="none" stroke-width="1"/><text x="1240" y="650" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#124938" font-weight="700" text-anchor="start" letter-spacing="0">REVIEW</text><text x="165" y="743" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#202A25" font-weight="700" text-anchor="start" letter-spacing="0">Minor wording tweak</text><text x="716" y="743" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">Helpful when the page has a clear issue</text><rect x="1223" y="711" width="160" height="42" rx="21" fill="#DDE9F0" stroke="none" stroke-width="1"/><text x="1240" y="740" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#124938" font-weight="700" text-anchor="start" letter-spacing="0">LATER</text></svg>