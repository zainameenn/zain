<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-label="Know where your results come from."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF7F0"/><stop offset="1" stop-color="#F0F1EB"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B5B47"/><stop offset="1" stop-color="#0E382D"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#273F35" flood-opacity=".10"/></filter><pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#C6C8B9" opacity=".5"/></pattern></defs><rect x="0" y="0" width="1600" height="960" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="960" rx="0" fill="url(#dots)" stroke="none" stroke-width="1"/><text x="75" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#A57F42" font-weight="700" text-anchor="start" letter-spacing="2.5">06 / OUTPUT TRANSPARENCY</text><text x="75" y="148" font-family="Georgia, serif" font-size="53" fill="#202A25" font-weight="400" text-anchor="start" letter-spacing="0">Know where your results come from.</text><text x="75" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">AI suggestions, technical checks and measured data are different.</text><rect x="75" y="925" width="140" height="4" rx="2" fill="#124938" stroke="none" stroke-width="1"/><text x="1470" y="930" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5C6962" font-weight="700" text-anchor="end" letter-spacing="1.5">ZAINAMEEN  /  FREE TOOLS</text><rect x="75" y="280" width="465" height="474" rx="24" fill="#FFFFFF" stroke="#D7D5CD" stroke-width="1" filter="url(#shadow)"/><rect x="105" y="311" width="406" height="108" rx="21" fill="#E3EFE9" stroke="none" stroke-width="1"/><text x="132" y="374" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#124938" font-weight="700" text-anchor="start" letter-spacing="1.2">AI WRITING</text><text x="109" y="488" font-family="Georgia, serif" font-size="34" fill="#202A25" font-weight="400" text-anchor="start" letter-spacing="0">Drafts and ideas</text><line x1="108" y1="526" x2="505" y2="526" stroke="#D7D5CD" stroke-width="2" stroke-linecap="round"/><text x="109" y="573" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#A57F42" font-weight="700" text-anchor="start" letter-spacing="1.2">What to verify</text><text x="109" y="622" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">Review facts and tone</text><rect x="580" y="280" width="465" height="474" rx="24" fill="#FFFFFF" stroke="#D7D5CD" stroke-width="1" filter="url(#shadow)"/><rect x="610" y="311" width="406" height="108" rx="21" fill="#F1E9DB" stroke="none" stroke-width="1"/><text x="637" y="374" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#124938" font-weight="700" text-anchor="start" letter-spacing="1.2">SITE CHECKS</text><text x="614" y="488" font-family="Georgia, serif" font-size="34" fill="#202A25" font-weight="400" text-anchor="start" letter-spacing="0">Page and tag signals</text><line x1="613" y1="526" x2="1010" y2="526" stroke="#D7D5CD" stroke-width="2" stroke-linecap="round"/><text x="614" y="573" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#A57F42" font-weight="700" text-anchor="start" letter-spacing="1.2">What to verify</text><text x="614" y="622" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">Review the severity</text><rect x="1085" y="280" width="465" height="474" rx="24" fill="#FFFFFF" stroke="#D7D5CD" stroke-width="1" filter="url(#shadow)"/><rect x="1115" y="311" width="406" height="108" rx="21" fill="#DDE9F0" stroke="none" stroke-width="1"/><text x="1142" y="374" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#124938" font-weight="700" text-anchor="start" letter-spacing="1.2">SEARCH DATA</text><text x="1119" y="488" font-family="Georgia, serif" font-size="34" fill="#202A25" font-weight="400" text-anchor="start" letter-spacing="0">Sourced metrics</text><line x1="1118" y1="526" x2="1515" y2="526" stroke="#D7D5CD" stroke-width="2" stroke-linecap="round"/><text x="1119" y="573" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#A57F42" font-weight="700" text-anchor="start" letter-spacing="1.2">What to verify</text><text x="1119" y="622" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">Check source and date</text><rect x="75" y="790" width="1469" height="63" rx="17" fill="#124938" stroke="none" stroke-width="1"/><text x="810" y="830" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#FFFFFF" font-weight="600" text-anchor="middle" letter-spacing="0">No search volume, ranking, or traffic estimate should come from AI guesses.</text></svg>