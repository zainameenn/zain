<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-label="A listing starts with accurate details."><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAF7F0"/><stop offset="1" stop-color="#F0F1EB"/></linearGradient><linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1B5B47"/><stop offset="1" stop-color="#0E382D"/></linearGradient><filter id="shadow" x="-20%" y="-30%" width="140%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#273F35" flood-opacity=".10"/></filter><pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#C6C8B9" opacity=".5"/></pattern></defs><rect x="0" y="0" width="1600" height="960" rx="0" fill="url(#bg)" stroke="none" stroke-width="1"/><rect x="0" y="0" width="1600" height="960" rx="0" fill="url(#dots)" stroke="none" stroke-width="1"/><text x="75" y="84" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#A57F42" font-weight="700" text-anchor="start" letter-spacing="2.5">05 / ECOMMERCE WORKFLOW</text><text x="75" y="148" font-family="Georgia, serif" font-size="53" fill="#202A25" font-weight="400" text-anchor="start" letter-spacing="0">A listing starts with accurate details.</text><text x="75" y="190" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#5C6962" font-weight="400" text-anchor="start" letter-spacing="0">Use real product information before writing persuasive copy.</text><rect x="75" y="925" width="140" height="4" rx="2" fill="#124938" stroke="none" stroke-width="1"/><text x="1470" y="930" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#5C6962" font-weight="700" text-anchor="end" letter-spacing="1.5">ZAINAMEEN  /  FREE TOOLS</text><rect x="88" y="246" width="425" height="560" rx="24" fill="#FFFFFF" stroke="#D7D5CD" stroke-width="1" filter="url(#shadow)"/><rect x="130" y="295" width="