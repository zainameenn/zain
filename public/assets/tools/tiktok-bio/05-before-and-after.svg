<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="tt5 dd5">
<title id="tt5">From generic to worth following</title><desc id="dd5">Specific topics help viewers understand what they will get.</desc>
<rect x="1" y="1" width="1118" height="628" rx="30" fill="#fffdf9" stroke="#e6ded0" stroke-width="2"/>
<rect x="32" y="30" width="70" height="8" rx="4" fill="#a17840" stroke="none" stroke-width="0"/>
<text x="48" y="100" font-family="Georgia, serif" font-size="44" fill="#21372c" font-weight="650" text-anchor="start">From generic to worth following</text>
<text x="48" y="141" font-family="Inter, Arial, sans-serif" font-size="23" fill="#53645a" font-weight="400" text-anchor="start">Specific topics help viewers understand what they will get.</text>
<rect x="50" y="191" width="470" height="286" rx="25" fill="#fff1ed" stroke="#efc4bf" stroke-width="1.5"/>
<rect x="77" y="213" width="122" height="41" rx="19" fill="#f9d9d2" stroke="none" stroke-width="0"/><text x="138.0" y="241" font-family="Inter, Arial, sans-serif" font-size="18" fill="#9a3c32" font-weight="600" text-anchor="middle">Before</text>
<text x="78" y="307" font-family="Inter, Arial, sans-serif" font-size="36" fill="#21372c" font-weight="700" text-anchor="start">Just vibing ✨</text>
<text x="78" y="359" font-family="Inter, Arial, sans-serif" font-size="23" fill="#53645a" font-weight="400" text-anchor="start">No clue what this account posts.</text>
<text x="78" y="391" font-family="Inter, Arial, sans-serif" font-size="22" fill="#53645a" font-weight="400" text-anchor="start">Hard to tell who it is for.</text>
<rect x="600" y="191" width="470" height="286" rx="25" fill="#e6f1ea" stroke="#bad6c2" stroke-width="1.5"/>
<rect x="625" y="213" width="120" height="41" rx="19" fill="#cce5d4" stroke="none" stroke-width="0"/><text x="685.0" y="241" font-family="Inter, Arial, sans-serif" font-size="18" fill="#154b3b" font-weight="600" text-anchor="middle">After</text>
<text x="625" y="305" font-family="Inter, Arial, sans-serif" font-size="28" fill="#21372c" font-weight="700" text-anchor="start">Five-minute desk workouts</text>
<text x="625" y="349" font-family="Inter, Arial, sans-serif" font-size="25" fill="#21372c" font-weight="400" text-anchor="start">for people who sit all day.</text>
<text x="625" y="403" font-family="Inter, Arial, sans-serif" font-size="21" fill="#53645a" font-weight="400" text-anchor="start">A topic and an audience in one line.</text>
<line x1="539" y1="328" x2="586" y2="328" stroke="#a17840" stroke-width="5" stroke-linecap="round" stroke-dasharray=""/>
<path d="M574 314 L592 328 L574 342" stroke="#a17840" stroke-width="5" stroke-linecap="round" fill="none"/>
<rect x="49" y="508" width="1023" height="68" rx="16" fill="#f5f1e8" stroke="none" stroke-width="0"/>
<text x="80" y="550" font-family="Inter, Arial, sans-serif" font-size="24" fill="#21372c" font-weight="600" text-anchor="start">Better question: “What will someone find if they follow this account?”</text>
</svg>