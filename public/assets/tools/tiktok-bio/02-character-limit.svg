<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="tt2 dd2">
<title id="tt2">80 characters. Make every one count.</title><desc id="dd2">A clearer bio beats a longer one.</desc>
<rect x="1" y="1" width="1118" height="628" rx="30" fill="#fffdf9" stroke="#e6ded0" stroke-width="2"/>
<rect x="32" y="30" width="70" height="8" rx="4" fill="#a17840" stroke="none" stroke-width="0"/>
<text x="48" y="100" font-family="Georgia, serif" font-size="44" fill="#21372c" font-weight="650" text-anchor="start">80 characters. Make every one count.</text>
<text x="48" y="141" font-family="Inter, Arial, sans-serif" font-size="23" fill="#53645a" font-weight="400" text-anchor="start">A clearer bio beats a longer one.</text>
<rect x="48" y="184" width="1024" height="154" rx="24" fill="#e6f1ea" stroke="#c8decf" stroke-width="1.5"/>
<text x="82" y="232" font-family="Inter, Arial, sans-serif" font-size="26" fill="#154b3b" font-weight="700" text-anchor="start">A good TikTok bio</text>
<text x="82" y="276" font-family="Inter, Arial, sans-serif" font-size="28" fill="#21372c" font-weight="600" text-anchor="start">Easy meals for busy students. New recipes every week.</text>
<text x="82" y="311" font-family="Inter, Arial, sans-serif" font-size="18" fill="#53645a" font-weight="400" text-anchor="start">Example bio  •  fits within the 80-character guideline</text>
<rect x="49" y="369" width="1021" height="34" rx="14" fill="#e8eee8" stroke="none" stroke-width="0"/>
<rect x="49" y="369" width="650" height="34" rx="14" fill="#154b3b" stroke="none" stroke-width="0"/>
<text x="50" y="437" font-family="Inter, Arial, sans-serif" font-size="20" fill="#53645a" font-weight="400" text-anchor="start">Characters used</text>
<text x="1068" y="437" font-family="Inter, Arial, sans-serif" font-size="21" fill="#21372c" font-weight="650" text-anchor="end">Maximum: 80</text>
<text x="50" y="507" font-family="Inter, Arial, sans-serif" font-size="24" fill="#21372c" font-weight="400" text-anchor="start">Spaces, punctuation, emojis and line breaks use space too.</text>
<rect x="47" y="541" width="1025" height="51" rx="13" fill="#f5f1e8" stroke="none" stroke-width="0"/>
<text x="69" y="574" font-family="Inter, Arial, sans-serif" font-size="20" fill="#a17840" font-weight="600" text-anchor="start">Tip: Leave a little room for edits. Your TikTok editor is the final check.</text>
