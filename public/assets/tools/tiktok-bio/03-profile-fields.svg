<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 630" role="img" aria-labelledby="tt3 dd3">
<title id="tt3">What goes where on a TikTok profile?</title><desc id="dd3">Do not squeeze the name, username, bio and website into one field.</desc>
<rect x="1" y="1" width="1118" height="628" rx="30" fill="#fffdf9" stroke="#e6ded0" stroke-width="2"/>
<rect x="32" y="30" width="70" height="8" rx="4" fill="#a17840" stroke="none" stroke-width="0"/>
<text x="48" y="100" font-family="Georgia, serif" font-size="44" fill="#21372c" font-weight="650" text-anchor="start">What goes where on a TikTok profile?</text>
<text x="48" y="141" font-family="Inter, Arial, sans-serif" font-size="23" fill="#53645a" font-weight="400" text-anchor="start">Do not squeeze the name, username, bio and website into one field.</text>
<rect x="69" y="177" width="359" height="399" rx="32" fill="#f8faf8" stroke="#bdcfc0" stroke-width="2"/>
<rect x="206" y="195" width="88" height="11" rx="6" fill="#c9d5cb" stroke="none" stroke-width="0"/>
<circle cx="248" cy="263" r="43" fill="#d5e9dd"/>
<text x="248" y="273" font-family="Inter, Arial, sans-serif" font-size="29" fill="#154b3b" font-weight="700" text-anchor="middle">JD</text>
<text x="250" y="337" font-family="Inter, Arial, sans-serif" font-size="28" fill="#21372c" font-weight="700" text-anchor="middle">Jamie Designs</text>
<text x="250" y="371" font-family="Inter, Arial, sans-serif" font-size="18" fill="#53645a" font-weight="400" text-anchor="middle">@jamie.designs</text>
<text x="250" y="429" font-family="Inter, Arial, sans-serif" font-size="22" fill="#21372c" font-weight="650" text-anchor="middle">Tiny room makeovers</text>
<text x="250" y="459" font-family="Inter, Arial, sans-serif" font-size="22" fill="#21372c" font-weight="650" text-anchor="middle">for renters ✨</text>
<rect x="130" y="480" width="239" height="44" rx="12" fill="#e6f1ea" stroke="#b4d6be" stroke-width="1.5"/>
<text x="249" y="509" font-family="Inter, Arial, sans-serif" font-size="17" fill="#154b3b" font-weight="600" text-anchor="middle">Website link (if eligible)</text>
<rect x="496" y="200" width="178" height="41" rx="19" fill="#e6f1ea" stroke="none" stroke-width="0"/><text x="585.0" y="228" font-family="Inter, Arial, sans-serif" font-size="18" fill="#154b3b" font-weight="600" text-anchor="middle">Name</text>
<text x="698" y="227" font-family="Inter, Arial, sans-serif" font-size="21" fill="#21372c" font-weight="400" text-anchor="start">Who people see on your profile</text>
<rect x="496" y="294" width="178" height="41" rx="19" fill="#e6f1ea" stroke="none" stroke-width="0"/><text x="585.0" y="322" font-family="Inter, Arial, sans-serif" font-size="18" fill="#154b3b" font-weight="600" text-anchor="middle">Username</text>
<text x="698" y="321" font-family="Inter, Arial, sans-serif" font-size="21" fill="#21372c" font-weight="400" text-anchor="start">Your @handle and profile URL</text>
<rect x="496" y="388" width="178" height="41" rx="19" fill="#e6f1ea" stroke="none" stroke-width="0"/><text x="585.0" y="416" font-family="Inter, Arial, sans-serif" font-size="18" fill="#154b3b" font-weight="600" text-anchor="middle">Bio</text>
<text x="698" y="415" font-family="Inter, Arial, sans-serif" font-size="21" fill="#21372c" font-weight="400" text-anchor="start">A short reason to follow</text>
<rect x="496" y="482" width="178" height="41" rx="19" fill="#e6f1ea" stroke="none" stroke-width="0"/><text x="585.0" y="510" font-family="Inter, Arial, sans-serif" font-size="18" fill="#154b3b" font-weight="600" text-anchor="middle">Website link</text>
<text x="698" y="509" font-family="Inter, Arial, sans-serif" font-size="21" fill="#21372c" font-weight="400" text-anchor="start">A separate, eligibility-based field</text>
<text x="53" y="611" font-family="Inter, Arial, sans-serif" font-size="17" fill="#53645a" font-weight="400" text-anchor="start">Illustrative interface, not a screenshot of TikTok.</text>
</svg>