<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title1 desc1"><title id="title1">From a photo to a caption worth posting</title><desc id="desc1">A picture gives context. Your details make the caption accurate.</desc>
