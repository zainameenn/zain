<rect x="621" y="216" width="151" height="40" rx="17" fill="white" stroke="none" stroke-width="0"/><text x="696.5" y="243" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#154B3B">CAPTION 01</text>
<text x="622" y="305" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700" fill="#24352D">New shelves are up,</text>
<text x="622" y="344" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="400" fill="#24352D">and the bookshop is ready.</text>
<text x="622" y="390" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="400" fill="#24352D">Come have a look this weekend.</text>
<line x1="625" y1="421" x2="1092" y2="421" stroke="#BAD4BE" stroke-width="2" stroke-linecap="round"/>
<text x="626" y="463" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" fill="#59675F">Specific information added by the owner</text>
