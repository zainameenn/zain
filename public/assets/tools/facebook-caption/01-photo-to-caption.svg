<path d="M95 395 L174 317 L238 381 L300 302 L407 413" fill="none" stroke="#154B3B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="355" cy="303" r="22" fill="#CDA76D"/>
<text x="78" y="517" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#24352D">Upload product, place or activity</text>
<line x1="479" y1="359" x2="560" y2="359" stroke="#A5793C" stroke-width="6" stroke-linecap="round"/>
