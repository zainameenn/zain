<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title9 desc9"><title id="title9">A useful Facebook caption in four parts</title><desc id="desc9">Not a rigid formula. Just a way to check if something is missing.</desc>
<rect x="1" y="1" width="1198" height="678" rx="30" fill="#FFFEFB" stroke="#E9E1D5" stroke-width="2"/>
<rect x="48" y="37" width="78" height="7" rx="4" fill="#A5793C" stroke="none" stroke-width="0"/>
<text x="49" y="105" text-anchor="start" font-family="Georgia, serif" font-size="42" font-weight="500" fill="#24352D">A useful Facebook caption in four parts</text>
<text x="50" y="146" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#59675F">Not a rigid formula. Just a way to check if something is missing.</text>
<rect x="50" y="197" width="1100" height="83" rx="16" fill="#E5F1EA" stroke="#DDDED6" stroke-width="1.4"/>
<rect x="72" y="218" width="69" height="40" rx="17" fill="white" stroke="none" stroke-width="0"/><text x="106.5" y="245" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#A5793C">01</text>
<text x="177" y="246" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#24352D">The point</text>
<text x="530" y="246" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#24352D">What is this post actually about?</text>
<rect x="50" y="296" width="1100" height="83" rx="16" fill="#F5F0E6" stroke="#DDDED6" stroke-width="1.4"/>
<rect x="72" y="317" width="69" height="40" rx="17" fill="white" stroke="none" stroke-width="0"/><text x="106.5" y="344" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#A5793C">02</text>
<text x="177" y="345" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#24352D">Useful detail</text>
<text x="530" y="345" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#24352D">What can you say that is true?</text>
<rect x="50" y="395" width="1100" height="83" rx="16" fill="#E5F1EA" stroke="#DDDED6" stroke-width="1.4"/>
<rect x="72" y="416" width="69" height="40" rx="17" fill="white" stroke="none" stroke-width="0"/><text x="106.5" y="443" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#A5793C">03</text>
<text x="177" y="444" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#24352D">A natural voice</text>
<text x="530" y="444" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#24352D">Would you say it like this aloud?</text>
<rect x="50" y="494" width="1100" height="83" rx="16" fill="#F5F0E6" stroke="#DDDED6" stroke-width="1.4"/>
<rect x="72" y="515" width="69" height="40" rx="17" fill="white" stroke="none" stroke-width="0"/><text x="106.5" y="542" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#A5793C">04</text>
<text x="177" y="543" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#24352D">Next action</text>
<text x="530" y="543" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#24352D">Is there something readers need to do?</text>
<rect x="49" y="611" width="1101" height="35" rx="10" fill="#154B3B" stroke="none" stroke-width="1.4"/>
<text x="600" y="636" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="500" fill="white">If no action is needed, let the caption end naturally.</text>
</svg>