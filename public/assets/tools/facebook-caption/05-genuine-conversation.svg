<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title5 desc5"><title id="title5">Real conversation or engagement bait?</title><desc id="desc5">Ask something useful when it makes sense. Do not force a question.</desc>
<rect x="1" y="1" width="1198" height="678" rx="30" fill="#FFFEFB" stroke="#E9E1D5" stroke-width="2"/>
<rect x="48" y="37" width="78" height="7" rx="4" fill="#A5793C" stroke="none" stroke-width="0"/>
<text x="49" y="105" text-anchor="start" font-family="Georgia, serif" font-size="42" font-weight="500" fill="#24352D">Real conversation or engagement bait?</text>
<text x="50" y="146" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#59675F">Ask something useful when it makes sense. Do not force a question.</text>
<rect x="50" y="207" width="525" height="351" rx="22" fill="#F9ECE8" stroke="#EDCBC7" stroke-width="1.4"/>
<rect x="75" y="230" width="154" height="40" rx="17" fill="#F4DDD9" stroke="none" stroke-width="0"/><text x="152.0" y="257" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#A34A3F">SKIP THIS</text>
<text x="77" y="317" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="750" fill="#A34A3F">LIKE if you agree!</text>
<text x="77" y="361" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="400" fill="#24352D">Tag 5 friends right now!</text>
<line x1="76" y1="392" x2="545" y2="392" stroke="#E8BCB8" stroke-width="2" stroke-linecap="round"/>
<text x="77" y="441" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#59675F">No helpful detail.</text>
<text x="77" y="478" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="400" fill="#59675F">Only asks for reactions.</text>
<rect x="621" y="207" width="528" height="351" rx="22" fill="#E5F1EA" stroke="#B8DCC6" stroke-width="1.4"/>
<rect x="647" y="230" width="154" height="40" rx="17" fill="white" stroke="none" stroke-width="0"/><text x="724.0" y="257" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650" fill="#154B3B">TRY THIS</text>
<text x="648" y="312" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="29" font-weight="700" fill="#24352D">We tested three layouts</text>
<text x="648" y="350" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="400" fill="#24352D">for a small home office.</text>
<text x="648" y="396" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="400" fill="#24352D">The corner desk saved space.</text>
<text x="648" y="441" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="400" fill="#154B3B">Which setup works in your room?</text>
<text x="648" y="500" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" fill="#59675F">A specific, relevant question.</text>
<text x="57" y="613" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="400" fill="#59675F">Meta warns that posts chasing reactions through engagement bait can be demoted.</text>
</svg>