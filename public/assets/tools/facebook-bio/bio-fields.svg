<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 570" role="img" aria-labelledby="t d"><title id="t">Facebook Intro and About section compared</title><desc id="d">A short profile Intro next to the longer About section, each with its own purpose.</desc><rect width="1200" height="570" rx="28" fill="#F8F5EE"/><g font-family="Figtree,Arial,sans-serif"><text x="58" y="64" font-size="18" font-weight="700" letter-spacing="2" fill="#7F5F26">THE TWO PROFILE FIELDS</text><text x="58" y="114" font-size="32" font-family="Lora,Georgia,serif" fill="#202821">Your short bio isn't your whole story.</text><g fill="#fff" stroke="#E4E0D6" stroke-width="2"><rect x="58" y="154" width="510" height="340" rx="22"/><rect x="632" y="154" width="510" height="340" rx="22"/></g><rect x="81" y="181" width="464" height="75" rx="12" fill="#D8E4D7"/><circle cx="134" cy="252" r="37" fill="#174B3A" stroke="#fff" stroke-width="5"/><text x="134" y="263" text-anchor="middle" fill="#fff" font-weight="700" font-size="28">Y</text><text x="187" y="238" fill="#202821" font-size="22" font-weight="600">Your profile</text><text x="187" y="263" fill="#687068" font-size="15">Intro</text><rect x="87" y="293" width="452" height="73" rx="14" fill="#F8F5EE"/><text x="106" y="323" fill="#202821" font-size="17" font-weight="600">Creator sharing simple ideas about</text><text x="106" y="347" fill="#202821" font-size="17" font-weight="600">content and everyday life.</text><text x="90" y="417" fill="#174B3A" font-size="18" font-weight="700">SHORT BIO</text><text x="90" y="447" fill="#687068" font-size="16">A quick introduction near the top.</text><text x="684" y="218" fill="#202821" font-size="20" font-weight="700">About</text><g fill="#EEF0EA"><rect x="662" y="243" width="420" height="15" rx="7"/><rect x="662" y="273" width="441" height="15" rx="7"/><rect x="662" y="303" width="388" height="15" rx="7"/><rect x="662" y="333" width="421" height="15" rx="7"/></g><text x="662" y="417" fill="#174B3A" font-size="18" font-weight="700">LONGER DESCRIPTION</text><text x="662" y="447" fill="#687068" font-size="16">Your details, background and context.</text><text x="600" y="537" text-anchor="middle" fill="#687068" font-size="16">A Facebook Group has its own description and community details.</text></g></svg>
