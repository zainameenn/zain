<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="t d"><title id="t">A simple Facebook bio formula</title><desc id="d">Three cards: who you are, what you do, and why people should follow, joined into one short sentence.</desc><rect width="1200" height="440" rx="28" fill="#F8F5EE"/><g font-family="Figtree,Arial,sans-serif"><text x="62" y="66" font-size="18" font-weight="700" letter-spacing="2" fill="#7F5F26">A GOOD FACEBOOK INTRO</text><text x="62" y="112" font-size="34" font-family="Lora,Georgia,serif" fill="#202821">Three things. One short sentence.</text><g fill="#fff" stroke="#E4E0D6" stroke-width="2"><rect x="58" y="164" width="316" height="190" rx="20"/><rect x="442" y="164" width="316" height="190" rx="20"/><rect x="826" y="164" width="316" height="190" rx="20"/></g><g fill="#D8E4D7"><circle cx="102" cy="207" r="22"/><circle cx="486" cy="207" r="22"/><circle cx="870" cy="207" r="22"/></g><g font-size="22" font-weight="700" fill="#174B3A" text-anchor="middle"><text x="102" y="215">1</text><text x="486" y="215">2</text><text x="870" y="215">3</text></g><g font-size="24" font-weight="600" fill="#202821"><text x="82" y="267">Who you are</text><text x="466" y="267">What you do</text><text x="850" y="267">Why follow</text></g><g font-size="17" fill="#4A524B"><text x="82" y="301">A person, brand or community.</text><text x="466" y="301">Your work, interests or niche.</text><text x="850" y="301">A reason to stay.</text></g><g fill="#174B3A"><circle cx="408" cy="259" r="22"/><circle cx="792" cy="259" r="22"/></g><g font-size="30" font-weight="600" fill="#fff" text-anchor="middle"><text x="408" y="269">+</text><text x="792" y="269">+</text></g><text x="600" y="406" text-anchor="middle" font-size="17" fill="#687068">Keep the first line clear. Skip the filler.</text></g></svg>
