<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="04 x bio before after"><title>04 x bio before after</title><rect x="0" y="0" width="1200" height="680" rx="0" fill="#F5F1E8" stroke="none" stroke-width="1"/><rect x="26" y="25" width="1148" height="630" rx="28" fill="#FFFFFF" stroke="#D9E1D9" stroke-width="2"/><text x="68" y="80" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">BEFORE AND AFTER</text><text x="68" y="129" fill="#143B30" font-family="Georgia, Lora, serif" font-size="39" font-weight="600" text-anchor="start" xml:space="preserve">Specific beats generic</text><rect x="74" y="180" width="504" height="328" rx="24" fill="#F3DAD4" stroke="none" stroke-width="1"/><rect x="102" y="208" width="126" height="36" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="165.0" y="232" fill="#C96B57" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">BEFORE</text><text x="104" y="295" fill="#143B30" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="700" text-anchor="start" xml:space="preserve">Dreamer | Hustler | Visionary</text><text x="104" y="333" fill="#143B30" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="normal" text-anchor="start" xml:space="preserve">Coffee lover | Big goals</text><line x1="104" y1="369" x2="546" y2="369" stroke="#C96B57" stroke-width="1" /><text x="104" y="408" fill="#C96B57" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">What is this account about?</text><text x="104" y="442" fill="#5A7066" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" xml:space="preserve">Nothing specific to follow for.</text><rect x="624" y="180" width="504" height="328" rx="24" fill="#E8F3ED" stroke="none" stroke-width="1"/><rect x="651" y="208" width="118" height="36" rx="18" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="710.0" y="232" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">AFTER</text><text x="654" y="292" fill="#143B30" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" xml:space="preserve">I help indie founders write clearer</text><text x="654" y="328" fill="#143B30" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start" xml:space="preserve">landing pages. Sharing copy tips</text><text x="654" y="364" fill="#143B30" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="normal" text-anchor="start" xml:space="preserve">and real examples each week.</text><line x1="654" y1="388" x2="1096" y2="388" stroke="#145A45" stroke-width="1" /><text x="654" y="428" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" xml:space="preserve">Clear role. Clear topic. Clear value.</text><text x="654" y="463" fill="#5A7066" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" xml:space="preserve">No exaggerated claims needed.</text><rect x="74" y="526" width="1054" height="50" rx="10" fill="#F5F1E8" stroke="none" stroke-width="1"/><text x="95" y="559" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" xml:space="preserve">A bio should tell a stranger what they will see in your posts.</text><text x="69" y="617" fill="#5A7066" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">ZAINAMEEN.COM  /  FREE X BIO GENERATOR</text><text x="1130" y="617" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end" xml:space="preserve">4 / 07</text></svg>