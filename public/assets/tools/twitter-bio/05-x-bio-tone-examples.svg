<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="05 x bio tone examples"><title>05 x bio tone examples</title><rect x="0" y="0" width="1200" height="680" rx="0" fill="#F5F1E8" stroke="none" stroke-width="1"/><rect x="26" y="25" width="1148" height="630" rx="28" fill="#FFFFFF" stroke="#D9E1D9" stroke-width="2"/><text x="68" y="80" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">BIO TONE EXAMPLES</text><text x="68" y="129" fill="#143B30" font-family="Georgia, Lora, serif" font-size="39" font-weight="600" text-anchor="start" xml:space="preserve">Same person, different voice</text><rect x="75" y="177" width="509" height="115" rx="16" fill="#E8F3ED" stroke="none" stroke-width="1"/><text x="100" y="210" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">PROFESSIONAL</text><text x="100" y="250" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve">Brand designer helping cafes look better online.</text><rect x="617" y="177" width="509" height="115" rx="16" fill="#F5F1E8" stroke="none" stroke-width="1"/><text x="642" y="210" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">FRIENDLY</text><text x="642" y="250" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve">Designer for lovely little cafes. Sharing what works.</text><rect x="75" y="310" width="509" height="115" rx="16" fill="#FFFFFF" stroke="#D9E1D9" stroke-width="1"/><text x="100" y="343" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">FUNNY</text><text x="100" y="383" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve">Designing cafe brands. Still cannot draw latte art.</text><rect x="617" y="310" width="509" height="115" rx="16" fill="#F1E4C9" stroke="none" stroke-width="1"/><text x="642" y="343" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">MINIMAL</text><text x="642" y="383" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve">Brand designer. Small businesses. Clear visuals.</text><rect x="75" y="443" width="509" height="115" rx="16" fill="#F5F1E8" stroke="none" stroke-width="1"/><text x="100" y="476" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">CONFIDENT</text><text x="100" y="516" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve">Making small cafe brands hard to overlook.</text><rect x="617" y="443" width="509" height="115" rx="16" fill="#E8F3ED" stroke="none" stroke-width="1"/><text x="642" y="476" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">AESTHETIC</text><text x="642" y="516" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start" xml:space="preserve">Thoughtful brands, warm colors and little details.</text><text x="69" y="617" fill="#5A7066" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">ZAINAMEEN.COM  /  FREE X BIO GENERATOR</text><text x="1130" y="617" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end" xml:space="preserve">5 / 07</text></svg>