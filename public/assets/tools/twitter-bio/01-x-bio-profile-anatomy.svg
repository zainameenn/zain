<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="01 x bio profile anatomy"><title>01 x bio profile anatomy</title><rect x="0" y="0" width="1200" height="680" rx="0" fill="#F5F1E8" stroke="none" stroke-width="1"/><rect x="26" y="25" width="1148" height="630" rx="28" fill="#FFFFFF" stroke="#D9E1D9" stroke-width="2"/><text x="68" y="80" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">ANATOMY OF A PROFILE</text><text x="68" y="129" fill="#143B30" font-family="Georgia, Lora, serif" font-size="39" font-weight="600" text-anchor="start" xml:space="preserve">What makes a useful X bio?</text><rect x="76" y="164" width="682" height="407" rx="24" fill="#FFFFFF" stroke="#D9E1D9" stroke-width="2"/><rect x="76" y="164" width="682" height="107" rx="23" fill="#0F3F32" stroke="none" stroke-width="1"/><circle cx="166" cy="249" r="49" fill="#F1E4C9"/><text x="166" y="266" fill="#0F3F32" font-family="Georgia, serif" font-size="54" font-weight="700" text-anchor="middle" xml:space="preserve">M</text><rect x="595" y="288" width="128" height="37" rx="20" fill="#FFFFFF" stroke="#D9E1D9" stroke-width="2"/><text x="659" y="313" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" xml:space="preserve">Follow</text><text x="117" y="353" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" xml:space="preserve">Maya Carter</text><text x="117" y="382" fill="#5A7066" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="start" xml:space="preserve">@mayawrites</text><text x="117" y="430" fill="#143B30" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" xml:space="preserve">Copywriter for indie brands. I share practical writing tips,</text><text x="117" y="459" fill="#143B30" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="normal" text-anchor="start" xml:space="preserve">better headlines and what I learn along the way.</text><rect x="117" y="487" width="144" height="36" rx="18" fill="#E8F3ED" stroke="none" stroke-width="1"/><text x="189.0" y="511" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">WHAT I DO</text><rect x="273" y="487" width="178" height="36" rx="18" fill="#E8F3ED" stroke="none" stroke-width="1"/><text x="362.0" y="511" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">WHAT I SHARE</text><rect x="462" y="487" width="209" height="36" rx="18" fill="#E8F3ED" stroke="none" stroke-width="1"/><text x="566.5" y="511" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" xml:space="preserve">WHY FOLLOW</text><rect x="795" y="187" width="323" height="115" rx="18" fill="#E8F3ED" stroke="none" stroke-width="1"/><text x="819" y="226" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" xml:space="preserve">Your role or identity</text><text x="819" y="258" fill="#5A7066" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" xml:space="preserve">Be specific, not clever.</text><rect x="795" y="321" width="323" height="115" rx="18" fill="#F5F1E8" stroke="none" stroke-width="1"/><text x="819" y="360" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" xml:space="preserve">A reason to follow</text><text x="819" y="392" fill="#5A7066" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" xml:space="preserve">What will people get?</text><rect x="795" y="455" width="323" height="115" rx="18" fill="#F1E4C9" stroke="none" stroke-width="1"/><text x="819" y="494" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="start" xml:space="preserve">Keep it readable</text><text x="819" y="526" fill="#5A7066" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="normal" text-anchor="start" xml:space="preserve">No keyword pileups.</text><text x="69" y="617" fill="#5A7066" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">ZAINAMEEN.COM  /  FREE X BIO GENERATOR</text><text x="1130" y="617" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="end" xml:space="preserve">1 / 07</text></svg>