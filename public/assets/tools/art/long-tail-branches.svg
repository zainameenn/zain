<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 170 1200 510" role="img" aria-labelledby="title desc"><title id="title">Long-tail keyword generator</title><desc id="desc">A seed keyword branching into specific keyword suggestions and natural-language search questions</desc>
<defs>
  <linearGradient id="soft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#EBF5ED"/><stop offset="1" stop-color="#D0E7D9"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1B6B51"/><stop offset="1" stop-color="#0F3F32"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7E6C8"/><stop offset="1" stop-color="#E5C18C"/></linearGradient>
  <linearGradient id="white" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F8F8F4"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#153E2C" flood-opacity=".13"/></filter>
  <filter id="smshadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#153E2C" flood-opacity=".10"/></filter>
