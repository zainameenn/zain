<title id="svgtitle">Etsy title, tags, attributes and description roles</title><desc id="svgdesc">Four listing fields have distinct jobs.</desc>
<rect width="1200" height="650" fill="#F7F4EE"/>
    <circle cx="1100" cy="0" r="270" fill="#E9F1EB" opacity=".65"/>
