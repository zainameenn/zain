    <text x="58" y="61" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">06 / LISTING SEO</text><text x="58" y="122" fill="#22322B" font-family="Georgia, serif" font-size="45" font-weight="400" text-anchor="start" >One title is not the whole listing</text><text x="58" y="161" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Use each field for its own job instead of forcing every keyword into the title.</text><rect x="58" y="230" width="247" height="260" rx="20" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="78" y="251" width="207" height="54" rx="12" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="182" y="286" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" >TITLE</text><text x="78" y="354" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" >Say what it is</text><text x="78" y="397" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" >Product + key facts</text><path d="M78 431 L284 431" fill="none" stroke="#DED8CC" stroke-width="2" stroke-linecap="round" /><circle cx="88" cy="456" r="7" fill="#145A45" stroke="none" stroke-width="1"/><text x="106" y="461" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Relevant and accurate</text><rect x="336" y="230" width="247" height="260" rx="20" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="356" y="251" width="207" height="54" rx="12" fill="#EDE7DC" stroke="none" stroke-width="1"/><text x="460" y="286" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" >TAGS</text><text x="356" y="354" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" >Cover related queries</text><text x="356" y="397" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" >Up to 13 short phrases</text><path d="M356 431 L562 431" fill="none" stroke="#DED8CC" stroke-width="2" stroke-linecap="round" /><circle cx="366" cy="456" r="7" fill="#145A45" stroke="none" stroke-width="1"/><text x="384" y="461" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Relevant and accurate</text><rect x="614" y="230" width="247" height="260" rx="20" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="634" y="251" width="207" height="54" rx="12" fill="#EFE8F2" stroke="none" stroke-width="1"/><text x="738" y="286" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" >ATTRIBUTES</text><text x="634" y="354" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" >Give structured details</text><text x="634" y="397" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" >Correct category options</text><path d="M634 431 L840 431" fill="none" stroke="#DED8CC" stroke-width="2" stroke-linecap="round" /><circle cx="644" cy="456" r="7" fill="#145A45" stroke="none" stroke-width="1"/><text x="662" y="461" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Relevant and accurate</text><rect x="892" y="230" width="247" height="260" rx="20" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="912" y="251" width="207" height="54" rx="12" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="1016" y="286" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle" >DESCRIPTION</text><text x="912" y="354" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" >Answer buyer questions</text><text x="912" y="397" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" text-anchor="start" >Size, materials, care</text><path d="M912 431 L1118 431" fill="none" stroke="#DED8CC" stroke-width="2" stroke-linecap="round" /><circle cx="922" cy="456" r="7" fill="#145A45" stroke="none" stroke-width="1"/><text x="940" y="461" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Relevant and accurate</text><rect x="108" y="530" width="984" height="58" rx="16" fill="#0F3F32" stroke="none" stroke-width="1"/><text x="600" y="566" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="middle" >The title introduces the item. Other listing fields add useful detail.</text>
