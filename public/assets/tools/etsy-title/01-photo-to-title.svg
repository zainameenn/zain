    </g><text x="215" y="505" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" >Upload a photo</text><rect x="474" y="289" width="255" height="174" rx="16" fill="#F7F4EE" stroke="none" stroke-width="1"/><text x="498" y="326" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" >Confirm what matters</text><text x="498" y="358" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Product</text><text x="705" y="358" fill="#145A45" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" >Coffee mug</text><text x="498" y="395" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Material</text><text x="705" y="395" fill="#145A45" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" >Ceramic</text><text x="498" y="432" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Finish</text><text x="705" y="432" fill="#145A45" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="end" >Speckled blue</text><text x="602" y="505" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" >Add real details</text><rect x="853" y="289" width="265" height="174" rx="16" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="873" y="325" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">YOUR TITLE</text><text x="873" y="358" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" >Speckled Blue</text><text x="873" y="391" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700" text-anchor="start" >Ceramic Coffee Mug</text><text x="873" y="432" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" >Copy   /   Edit   /   Retry</text><text x="986" y="505" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" >Get three title ideas</text><path d="M383 378 H437" stroke="#648679" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M427 370 L437 378 L427 386" stroke="#648679" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M769 378 H821" stroke="#648679" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M811 370 L821 378 L811 386" stroke="#648679" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="611" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="middle" >The photo does not prove measurements, materials, or how an item was made.</text>
