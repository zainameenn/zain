    <text x="58" y="61" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">01 / WORKFLOW</text><text x="58" y="122" fill="#22322B" font-family="Georgia, serif" font-size="45" font-weight="400" text-anchor="start" >From product photo to a clearer title</text><text x="58" y="161" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >A photo starts the draft. Seller-confirmed details make the final title accurate.</text><rect x="58" y="202" width="315" height="360" rx="22" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="444" y="202" width="315" height="360" rx="22" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="830" y="202" width="312" height="360" rx="22" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="81" y="226" width="95" height="32" rx="16" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="128.5" y="248" fill="#145A45" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" >STEP 01</text><rect x="466" y="226" width="98" height="32" rx="16" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="515.0" y="248" fill="#145A45" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" >STEP 02</text><rect x="852" y="226" width="98" height="32" rx="16" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="901.0" y="248" fill="#145A45" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle" >STEP 03</text><g transform="translate(112,287) scale(0.86)">
