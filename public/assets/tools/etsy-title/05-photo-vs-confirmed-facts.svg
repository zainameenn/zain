<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">What a product photo can and cannot verify</title><desc id="svgdesc">Visible product attributes contrasted with seller-confirmed facts.</desc>
<rect width="1200" height="650" fill="#F7F4EE"/>
    <circle cx="1100" cy="0" r="270" fill="#E9F1EB" opacity=".65"/>
    <circle cx="60" cy="625" r="160" fill="#EDE7DC" opacity=".55"/>
    <text x="58" y="61" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">05 / IMAGE ACCURACY</text><text x="58" y="122" fill="#22322B" font-family="Georgia, serif" font-size="45" font-weight="400" text-anchor="start" >What can a photo actually tell us?</text><text x="58" y="161" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >AI can describe what it sees. It should not invent information sellers need to confirm.</text><rect x="58" y="204" width="523" height="366" rx="24" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="619" y="204" width="523" height="366" rx="24" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="86" y="236" width="206" height="32" rx="16" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="189.0" y="258" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" >VISIBLE IN THE PHOTO</text><rect x="647" y="236" width="226" height="32" rx="16" fill="#EDE7DC" stroke="none" stroke-width="1"/><text x="760.0" y="258" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" >SELLER MUST CONFIRM</text><g transform="translate(91,310) scale(0.72)">
    <ellipse cx="99" cy="172" rx="86" ry="17" fill="#DED8CC" opacity=".4"/>
    <path d="M26 28 H158 L148 154 Q91 180 36 154 Z" fill="#9CB7AC" stroke="#0F3F32" stroke-width="6" stroke-linejoin="round"/>
    <path d="M157 47 C223 36 225 135 156 135" fill="none" stroke="#0F3F32" stroke-width="17" stroke-linecap="round"/>
    <path d="M158 50 C205 47 202 116 155 116" fill="none" stroke="#F7F4EE" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="91" cy="28" rx="67" ry="13" fill="#D0DDD5" stroke="#0F3F32" stroke-width="5"/>
    <path d="M57 66 C76 48 95 86 120 64 M58 112 C80 96 110 125 138 104" stroke="#EEF3EF" stroke-width="5" fill="none" opacity=".9"/>
    <circle cx="70" cy="92" r="5" fill="#0F3F32" opacity=".3"/><circle cx="128" cy="133" r="4" fill="#0F3F32" opacity=".28"/>
    </g><text x="304" y="341" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start" >Shape and type</text><text x="300" y="382" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start" >Visible colors</text><text x="300" y="423" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start" >Visible pattern</text><circle cx="275" cy="331" r="4" fill="#145A45" stroke="none" stroke-width="1"/><circle cx="275" cy="372" r="4" fill="#145A45" stroke="none" stroke-width="1"/><circle cx="275" cy="413" r="4" fill="#145A45" stroke="none" stroke-width="1"/><text x="654" y="324" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start" >Material</text><text x="654" y="353" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Ceramic or another material?</text><path d="M654 367 L1098 367" fill="none" stroke="#DED8CC" stroke-width="2" stroke-linecap="round" /><text x="654" y="401" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start" >Exact size</text><text x="654" y="430" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Dimensions or capacity?</text><path d="M654 444 L1098 444" fill="none" stroke="#DED8CC" stroke-width="2" stroke-linecap="round" /><text x="654" y="478" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="600" text-anchor="start" >Claims</text><text x="654" y="507" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Handmade, vintage or custom?</text><rect x="86" y="517" width="460" height="3" rx="1" fill="#E9F1EB" stroke="none" stroke-width="1"/><rect x="647" y="517" width="460" height="3" rx="1" fill="#EDE7DC" stroke="none" stroke-width="1"/><text x="600" y="613" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" >If an important detail is uncertain, ask for it or leave it out of the title.</text>
    </svg>