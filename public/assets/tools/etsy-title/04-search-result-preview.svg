<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">Etsy title in a product search preview</title><desc id="svgdesc">Example of an item-first listing title in a mock marketplace product preview.</desc>
<rect width="1200" height="650" fill="#F7F4EE"/>
    <circle cx="1100" cy="0" r="270" fill="#E9F1EB" opacity=".65"/>
    <circle cx="60" cy="625" r="160" fill="#EDE7DC" opacity=".55"/>
    <text x="58" y="61" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">04 / BUYER PREVIEW</text><text x="58" y="122" fill="#22322B" font-family="Georgia, serif" font-size="45" font-weight="400" text-anchor="start" >The first words help buyers decide</text><text x="58" y="161" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Show shoppers the product immediately, especially when a result is seen on mobile.</text><rect x="75" y="202" width="726" height="375" rx="24" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="99" y="228" width="286" height="286" rx="18" fill="#F7F4EE" stroke="none" stroke-width="1"/><g transform="translate(153,285) scale(1.15)">
    <ellipse cx="99" cy="172" rx="86" ry="17" fill="#DED8CC" opacity=".4"/>
    <path d="M26 28 H158 L148 154 Q91 180 36 154 Z" fill="#9CB7AC" stroke="#0F3F32" stroke-width="6" stroke-linejoin="round"/>
    <path d="M157 47 C223 36 225 135 156 135" fill="none" stroke="#0F3F32" stroke-width="17" stroke-linecap="round"/>
    <path d="M158 50 C205 47 202 116 155 116" fill="none" stroke="#F7F4EE" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="91" cy="28" rx="67" ry="13" fill="#D0DDD5" stroke="#0F3F32" stroke-width="5"/>
    <path d="M57 66 C76 48 95 86 120 64 M58 112 C80 96 110 125 138 104" stroke="#EEF3EF" stroke-width="5" fill="none" opacity=".9"/>
    <circle cx="70" cy="92" r="5" fill="#0F3F32" opacity=".3"/><circle cx="128" cy="133" r="4" fill="#0F3F32" opacity=".28"/>
    </g><text x="418" y="251" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1">PRODUCT PREVIEW</text><text x="418" y="304" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" >Blue Speckled</text><text x="418" y="339" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" >Ceramic Coffee Mug</text><text x="418" y="389" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >A simple, readable product name.</text><text x="418" y="434" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >Only verified product details.</text><rect x="840" y="240" width="284" height="260" rx="24" fill="#0F3F32" stroke="none" stroke-width="1"/><text x="871" y="286" fill="#C3D7CA" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" letter-spacing="1">START WITH</text><text x="871" y="339" fill="#FFFFFF" font-family="Georgia, serif" font-size="34" font-weight="400" text-anchor="start" >What is it?</text><path d="M871 366 L1087 366" fill="none" stroke="#6B9785" stroke-width="2" stroke-linecap="round" /><text x="871" y="402" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >Then add the detail</text><text x="871" y="429" fill="#FFFFFF" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start" >that distinguishes it.</text><text x="600" y="615" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" >Illustrative listing preview. It is not a live Etsy search result or ranking estimate.</text>
    </svg>