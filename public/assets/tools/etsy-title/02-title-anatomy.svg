<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">Anatomy of a clear Etsy listing title</title><desc id="svgdesc">Breaks down item, characteristics and readable wording.</desc>
<rect width="1200" height="650" fill="#F7F4EE"/>
    <circle cx="1100" cy="0" r="270" fill="#E9F1EB" opacity=".65"/>
    <circle cx="60" cy="625" r="160" fill="#EDE7DC" opacity=".55"/>
    <text x="58" y="61" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">02 / TITLE ANATOMY</text><text x="58" y="122" fill="#22322B" font-family="Georgia, serif" font-size="45" font-weight="400" text-anchor="start" >What goes into a good Etsy title?</text><text x="58" y="161" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Name the item first, then the characteristics a buyer needs to recognize it.</text><rect x="58" y="204" width="1084" height="142" rx="22" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><text x="86" y="245" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="start" letter-spacing="1.2">EXAMPLE TITLE</text><rect x="86" y="267" width="381" height="51" rx="12" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="103" y="301" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" text-anchor="start" >Ceramic Coffee Mug</text><rect x="476" y="267" width="324" height="51" rx="12" fill="#EDE7DC" stroke="none" stroke-width="1"/><text x="493" y="301" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="600" text-anchor="start" >Speckled Blue Glaze</text><rect x="809" y="267" width="303" height="51" rx="12" fill="#EFE8F2" stroke="none" stroke-width="1"/><text x="825" y="301" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" text-anchor="start" >12 oz</text><rect x="58" y="383" width="337" height="194" rx="18" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1"/><circle cx="93" cy="419" r="18" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="93" y="425" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" >01</text><text x="123" y="427" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" >Name the product</text><text x="83" y="480" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Say what is for sale.</text><text x="83" y="511" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Use buyer language.</text><rect x="430" y="383" width="337" height="194" rx="18" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1"/><circle cx="465" cy="419" r="18" fill="#EDE7DC" stroke="none" stroke-width="1"/><text x="465" y="425" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" >02</text><text x="495" y="427" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" >Add a key trait</text><text x="455" y="480" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Only factual details.</text><text x="455" y="511" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Think color or style.</text><rect x="802" y="383" width="340" height="194" rx="18" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1"/><circle cx="837" cy="419" r="18" fill="#EFE8F2" stroke="none" stroke-width="1"/><text x="837" y="425" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" >03</text><text x="867" y="427" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" text-anchor="start" >Confirm specifics</text><text x="827" y="480" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Size belongs here</text><text x="827" y="511" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >only when known.</text><text x="600" y="621" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" >Etsy allows up to 140 characters and recommends titles that are clear and easy to scan.</text>
    </svg>