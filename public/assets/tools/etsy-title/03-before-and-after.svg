<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="svgtitle svgdesc">
<title id="svgtitle">Clear vs repetitive Etsy titles</title><desc id="svgdesc">Before and after comparison of a repetitive title and concise descriptive title.</desc>
<rect width="1200" height="650" fill="#F7F4EE"/>
    <circle cx="1100" cy="0" r="270" fill="#E9F1EB" opacity=".65"/>
    <circle cx="60" cy="625" r="160" fill="#EDE7DC" opacity=".55"/>
    <text x="58" y="61" fill="#B38842" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start" letter-spacing="2">03 / READABILITY</text><text x="58" y="122" fill="#22322B" font-family="Georgia, serif" font-size="45" font-weight="400" text-anchor="start" >Clear titles beat keyword piles</text><text x="58" y="161" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >An accurate title should sound like a product name, not a list of search terms.</text><rect x="58" y="213" width="515" height="345" rx="24" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="627" y="213" width="515" height="345" rx="24" fill="#FFFFFF" stroke="#DED8CC" stroke-width="1.5"/><rect x="85" y="239" width="165" height="32" rx="16" fill="#F6E4DD" stroke="none" stroke-width="1"/><text x="167.5" y="261" fill="#A24B36" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" >HARD TO READ</text><rect x="654" y="239" width="173" height="32" rx="16" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="740.5" y="261" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" >CLEAR &amp; SPECIFIC</text><text x="86" y="324" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start" >blue mug coffee mug pottery</text><text x="86" y="359" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start" >mug cup gift mug blue ceramic</text><text x="86" y="394" fill="#22322B" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="600" text-anchor="start" >mug handmade best gift</text><text x="86" y="489" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="start" >Repeated terms hide what matters.</text><text x="655" y="324" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" >Blue Speckled Ceramic</text><text x="655" y="364" fill="#0F3F32" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" text-anchor="start" >Coffee Mug</text><text x="655" y="421" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >Product first. One clear detail.</text><text x="655" y="451" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="400" text-anchor="start" >No unsupported promises.</text><rect x="86" y="513" width="460" height="4" rx="2" fill="#F6E4DD" stroke="none" stroke-width="1"/><rect x="655" y="513" width="459" height="4" rx="2" fill="#E9F1EB" stroke="none" stroke-width="1"/><text x="600" y="616" fill="#6D7972" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="400" text-anchor="middle" >There is no guaranteed ranking formula. Clarity and accurate product detail come first.</text>
    </svg>