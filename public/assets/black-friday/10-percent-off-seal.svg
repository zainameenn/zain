<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">Black Friday 10 percent discount seal</title><desc id="desc">Round gold and forest green 10 percent off Black Friday badge.</desc>
<defs>
  <linearGradient id="forestGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0F3F32"/><stop offset="1" stop-color="#256D54"/></linearGradient>
  <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6E3B6"/><stop offset="0.45" stop-color="#D7B16A"/><stop offset="1" stop-color="#B88941"/></linearGradient>
  <linearGradient id="softGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFDF8"/><stop offset="1" stop-color="#F1F0E8"/></linearGradient>
  <linearGradient id="greenSoft" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C8DFD2"/><stop offset="1" stop-color="#87B49A"/></linearGradient>
  <filter id="shadow" x="-35%" y="-40%" width="170%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#163F33" flood-opacity="0.13"/></filter>
  <filter id="softShadow" x="-35%" y="-40%" width="170%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#163F33" flood-opacity="0.10"/></filter>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#B88A45" opacity=".27"/></pattern>
  <symbol id="spark" viewBox="0 0 34 34"><path d="M17 1 Q19 15 33 17 Q19 19 17 33 Q15 19 1 17 Q15 15 17 1Z" fill="currentColor"/></symbol>
  <symbol id="arrowUp" viewBox="0 0 28 28"><path d="M14 22V6M7 13l7-7 7 7" stroke="currentColor" stroke-width="2.7" fill="none" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="check" viewBox="0 0 24 24"><path d="m4 13 5 5L20 6" stroke="currentColor" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs>
<circle cx="320" cy="320" r="278" fill="url(#goldGrad)"/>
<circle cx="320" cy="320" r="250" fill="none" stroke="#0F3F32" stroke-width="3" stroke-dasharray="8 14" opacity=".60"/>
<circle cx="320" cy="320" r="224" fill="none" stroke="#F9E8B8" stroke-width="3"/>
<text x="320" y="214" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="760" fill="#0F3F32" text-anchor="middle" letter-spacing="3">BLACK FRIDAY</text>
<text x="320" y="364" font-family="Inter, Arial, sans-serif" font-size="145" font-weight="800" fill="#0F3F32" text-anchor="middle" >10%</text>
<text x="320" y="436" font-family="Inter, Arial, sans-serif" font-size="58" font-weight="800" fill="#0F3F32" text-anchor="middle" >OFF</text>
<use href="#spark" x="119" y="310" width="28.5" height="28.5" style="color:#0F3F32"/>
<use href="#spark" x="491" y="306" width="28.5" height="28.5" style="color:#0F3F32"/>
</svg>