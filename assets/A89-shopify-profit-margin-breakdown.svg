<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="ttl ds"><title id="ttl">Shopify Profit Margin Calculator</title><desc id="ds">A storefront sale is broken into revenue, product cost, transaction fees and remaining margin with a clear proportional illustration.</desc><ellipse cx="599" cy="700" rx="496" ry="18" fill="#202821" opacity="0.07"/><rect x="103" y="226" width="385" height="341" rx="23" fill="#202821" stroke="none" stroke-width="0" opacity="0.075"/><rect x="94" y="215" width="385" height="341" rx="23" fill="#F8F5EE" stroke="#202821" stroke-width="4" opacity="1"/><rect x="118" y="240" width="176" height="32" rx="16" fill="#D6E8D6" stroke="none" stroke-width="0" opacity="1"/><text x="206.0" y="262" fill="#174B3A" font-size="15" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="750" text-anchor="middle">STORE ORDER</text><path d="M194 321L330 321L352 478L171 478Z" fill="#F3E8D4" stroke="#202821" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M212 323Q214 277 260 277Q310 277 310 323" fill="none" stroke="#174B3A" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><path d="M201 354Q248 370 313 349" fill="none" stroke="#B99151" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="210" y="503" width="145" height="28" rx="8" fill="#FFFFFF" stroke="#202821" stroke-width="2" opacity="1"/><text x="282" y="523" fill="#174B3A" font-size="14" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-weight="750" text-anchor="middle">ONE ORDER</text><path d="M491 398L555 398" fill="none" stroke="#B99151" stroke-width="4" stroke-linecap="round"/><path d="M539 386 L555 398 L539 410" fill="none" stroke="#B99151" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="1"/><rect x="619" y="164" width="497" height="460" rx="23" fill="#202821" stroke="none" stroke-width="0" opacity="0.075"/><rect