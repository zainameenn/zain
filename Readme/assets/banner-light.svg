<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Zain Ul Abdin, growth marketing specialist for SaaS and service businesses">
  <style>
    .draw{stroke-dasharray:620;stroke-dashoffset:620;animation:draw 2.6s cubic-bezier(.6,.05,.25,1) .3s forwards}
    .fade{opacity:0;animation:fade 1.2s ease 1.6s forwards}
    .pulse{transform-origin:1196px 104px;animation:pulse 2.4s ease-in-out 2.8s infinite}
    .chip{opacity:0;animation:fade .6s ease forwards}
    @keyframes draw{to{stroke-dashoffset:0}}
    @keyframes fade{to{opacity:1}}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(2.2);opacity:0}}
    </style>
  <defs>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D9662B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D9662B" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="85%" cy="20%" r="60%">
      <stop offset="0" stop-color="#D9662B" stop-opacity=".10"/>
      <stop offset="1" stop-color="#D9662B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="400" rx="28" fill="#F2EFEA"/>
  <rect width="1280" height="400" rx="28" fill="url(#halo)"/>
  <rect x="64" y="58" width="262" height="32" rx="16" fill="none" stroke="#D9662B" stroke-opacity=".55"/>
  <circle cx="84" cy="74" r="4.5" fill="#4E8A6E"/>
  <text x="98" y="79" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#D9662B">TAKING NEW PROJECTS</text>
  <text x="62" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#1A1917">Zain Ul Abdin</text>
  <text x="64" y="208" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#1A1917">Growth marketing specialist for SaaS</text>
  <text x="64" y="250" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="28" fill="#D9662B">minus the second full time job.</text>
  <g class="chip" style="animation-delay:0.20s"><rect x="64" y="304" width="56" height="34" rx="17" fill="#FBF9F6" stroke="#E2DCD3"/><text x="92" y="327" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1917">SEO</text></g><g class="chip" style="animation-delay:0.32s"><rect x="130" y="304" width="86" height="34" rx="17" fill="#FBF9F6" stroke="#E2DCD3"/><text x="173" y="327" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1917">Reddit</text></g><g class="chip" style="animation-delay:0.44s"><rect x="226" y="304" width="86" height="34" rx="17" fill="#FBF9F6" stroke="#E2DCD3"/><text x="269" y="327" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1917">Social</text></g><g class="chip" style="animation-delay:0.56s"><rect x="322" y="304" width="96" height="34" rx="17" fill="#FBF9F6" stroke="#E2DCD3"/><text x="370" y="327" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1917">Content</text></g><g class="chip" style="animation-delay:0.68s"><rect x="428" y="304" width="56" height="34" rx="17" fill="#FBF9F6" stroke="#E2DCD3"/><text x="456" y="327" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#1A1917">Ads</text></g>
  <line x1="780" y1="130" x2="1210" y2="130" stroke="#E2DCD3" stroke-width="1"/><line x1="780" y1="190" x2="1210" y2="190" stroke="#E2DCD3" stroke-width="1"/><line x1="780" y1="250" x2="1210" y2="250" stroke="#E2DCD3" stroke-width="1"/><line x1="780" y1="310" x2="1210" y2="310" stroke="#E2DCD3" stroke-width="1"/>
  <path class="fade" d="M780,318 C880,314 930,292 990,252 S1100,150 1196,104 L1196,318 Z" fill="url(#area)"/>
  <path class="draw" d="M780,318 C880,314 930,292 990,252 S1100,150 1196,104" fill="none" stroke="#D9662B" stroke-width="4" stroke-linecap="round"/>
  <circle class="pulse" cx="1196" cy="104" r="7" fill="#D9662B"/>
  <circle class="fade" cx="1196" cy="104" r="7" fill="#D9662B"/>
  <g class="fade">
    <rect x="1034" y="56" width="140" height="34" rx="10" fill="#FBF9F6" stroke="#E2DCD3"/>
    <text x="1104" y="79" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#1A1917">100K+ users</text>
  </g>
  <text x="780" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#6B655D">One plan. One person. Fewer tabs.</text>
</svg>